<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08081c"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="brd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="260" r="165" fill="#4338ca" opacity="0.15" filter="url(#ambient)"/>
  <rect x="82" y="162" width="348" height="188" rx="10" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.12"/>

  <polygon points="190,145 190,367 385,256" fill="url(#play)" opacity="0.45" filter="url(#glow)"/>
  <polygon points="190,145 190,367 385,256" fill="url(#play)"/>

  <circle cx="86"  cy="88"  r="2"   fill="#a855f7" opacity="0.65"/>
  <circle cx="426" cy="82"  r="1.5" fill="#22d3ee" opacity="0.55"/>
  <circle cx="438" cy="430" r="2"   fill="#a855f7" opacity="0.42"/>
  <circle cx="74"  cy="436" r="1.5" fill="#22d3ee" opacity="0.48"/>
  <circle cx="148" cy="64"  r="1"   fill="#ffffff"  opacity="0.38"/>
  <circle cx="384" cy="452" r="1"   fill="#ffffff"  opacity="0.3"/>
  <circle cx="60"  cy="198" r="0.8" fill="#a855f7"  opacity="0.3"/>
  <circle cx="453" cy="174" r="0.8" fill="#22d3ee"  opacity="0.28"/>

  <rect width="512" height="512" rx="112" fill="none" stroke="url(#brd)" stroke-width="1.5"/>
</svg>
